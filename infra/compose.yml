services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voyaura}
      POSTGRES_USER: ${POSTGRES_USER:-voyaura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voyaura_dev_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voyaura} -d ${POSTGRES_DB:-voyaura}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-public.ecr.aws/docker/library/redis:7.4.7-alpine}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest@sha256:fb893e36fc369d41e92f678b17ec27378fa5bf0576aeef7ac15460c13629ab5a}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-voyaura}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-voyaura_minio_dev_only}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://127.0.0.1:5174,http://localhost:5174}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:

