name: Validate Voyaura

on: [push, pull_request]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chinese caption fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install --require-hashes -r requirements-dev.lock
        working-directory: api
      - run: python -m ruff check app tests
        working-directory: api
      - run: python -m pytest -q
        working-directory: api
      - run: python scripts/local_setup.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: voyaura
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: voyaura
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      VOYAURA_DATABASE_URL: postgresql+psycopg://voyaura:isolated_ci_only@127.0.0.1:5432/voyaura
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
        working-directory: api
      - run: python -m alembic upgrade head
        working-directory: api
      - run: python -m app.seed
        working-directory: api

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
        working-directory: api
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: python scripts/verify_e2e.py
        env:
          VOYAURA_E2E_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: .local/e2e-evidence/
